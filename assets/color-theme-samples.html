<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POSTERLEAGUE — Color Theme Samples</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #111;
      color: #eee;
      padding: 32px 20px 64px;
    }
    .page-title {
      text-align: center;
      margin-bottom: 8px;
      font-family: 'Cormorant', serif;
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 700;
    }
    .page-sub {
      text-align: center;
      color: #999;
      font-size: 13px;
      margin-bottom: 40px;
      max-width: 640px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 28px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .option-card {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #333;
      background: #1a1a1a;
    }
    .option-label {
      padding: 14px 16px;
      border-bottom: 1px solid #333;
    }
    .option-label h2 {
      font-family: 'Cormorant', serif;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .option-label p {
      font-size: 11px;
      color: #888;
      line-height: 1.5;
    }
    .swatches {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      border-bottom: 1px solid #333;
      flex-wrap: wrap;
    }
    .swatch {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .swatch span:first-child {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .swatch span:last-child {
      font-size: 8px;
      color: #666;
      font-family: monospace;
    }
    .modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .mode-tag {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 10px;
      text-align: center;
      opacity: 0.7;
    }
    .preview {
      padding: 0;
      min-height: 220px;
      position: relative;
      overflow: hidden;
    }
    .preview-inner {
      transform: scale(0.92);
      transform-origin: top center;
      width: 108.7%;
      margin-left: -4.35%;
    }
    .mock-announce {
      font-size: 7px;
      text-align: center;
      padding: 5px 8px;
      letter-spacing: 0.03em;
      font-weight: 500;
    }
    .mock-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      font-size: 8px;
      font-weight: 600;
      border-bottom: 1px solid;
    }
    .mock-logo {
      font-family: 'Cormorant', serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .mock-logo-badge {
      font-family: 'Montserrat', sans-serif;
      font-size: 7px;
      padding: 2px 4px;
      border-radius: 3px;
      font-weight: 700;
    }
    .mock-nav {
      display: flex;
      gap: 8px;
      font-size: 7px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .mock-hot {
      font-size: 6px;
      padding: 1px 4px;
      border-radius: 100px;
      font-weight: 700;
      margin-left: 2px;
    }
    .mock-hero {
      padding: 28px 16px 20px;
      text-align: center;
    }
    .mock-pill {
      display: inline-block;
      font-size: 6px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 100px;
      border: 1px solid;
      margin-bottom: 10px;
    }
    .mock-title {
      font-family: 'Cormorant', serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .mock-sub {
      font-size: 7px;
      line-height: 1.5;
      max-width: 200px;
      margin: 0 auto 14px;
    }
    .mock-btns {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .mock-btn {
      font-size: 6px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid transparent;
    }
    .mock-features {
      display: flex;
      justify-content: center;
      gap: 0;
      border-top: 1px solid;
      padding-top: 10px;
    }
    .mock-feat {
      flex: 1;
      text-align: center;
      padding: 0 6px;
      border-right: 1px solid;
    }
    .mock-feat:last-child { border-right: none; }
    .mock-feat strong {
      display: block;
      font-size: 9px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .mock-feat span {
      font-size: 5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .current-banner {
      max-width: 1400px;
      margin: 0 auto 32px;
      padding: 16px;
      border-radius: 12px;
      border: 2px dashed #444;
      background: #1a1a1a;
    }
    .current-banner h2 {
      font-family: 'Cormorant', serif;
      font-size: 18px;
      margin-bottom: 12px;
      color: #FFBA00;
    }
    .current-modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 700px) {
      .modes, .current-modes { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1 class="page-title">POSTERLEAGUE Color Themes</h1>
  <p class="page-sub">5 premium palettes for light + dark mode. Each preview mirrors your hero layout with Cormorant headings and Montserrat body text. Pick a number (1–5) to apply site-wide.</p>

  <div class="current-banner">
    <h2>Current — Bright Amber (#FFBA00)</h2>
    <div class="current-modes" id="current-previews"></div>
  </div>

  <div class="grid" id="options-grid"></div>

  <script>
    const options = [
      {
        id: 1,
        name: 'Stone & Antique Gold',
        desc: 'Classic luxury. Muted gold on warm stone neutrals.',
        light: { bg: '#FAFAF9', surface: '#FFFFFF', text: '#0C0A09', muted: '#57534E', border: '#D6D3D1', accent: '#A16207', accentText: '#FFFFFF', accentHover: '#854D0E', headerBg: '#FFFFFF', announceBg: '#0C0A09', announceText: '#FAFAF9' },
        dark:  { bg: '#0C0A09', surface: '#1C1917', text: '#FAFAF9', muted: '#A8A29E', border: '#292524', accent: '#C9A227', accentText: '#0C0A09', accentHover: '#D4AF37', headerBg: '#1C1917', announceBg: '#000000', announceText: '#FAFAF9' }
      },
      {
        id: 2,
        name: 'Charcoal & Champagne',
        desc: 'Editorial warmth. Cream tones with champagne bronze accent.',
        light: { bg: '#F5F3EF', surface: '#FFFFFF', text: '#1A1814', muted: '#6B6560', border: '#E7E2DB', accent: '#8B7355', accentText: '#FFFFFF', accentHover: '#6F5C44', headerBg: '#FFFFFF', announceBg: '#1A1814', announceText: '#EDEBE6' },
        dark:  { bg: '#121110', surface: '#1A1816', text: '#EDEBE6', muted: '#9C9590', border: '#2C2826', accent: '#C4A574', accentText: '#121110', accentHover: '#D4B896', headerBg: '#1A1816', announceBg: '#000000', announceText: '#EDEBE6' }
      },
      {
        id: 3,
        name: 'Gallery Monochrome',
        desc: 'Ultra-minimal. Art is the color — UI stays neutral.',
        light: { bg: '#FFFFFF', surface: '#FAFAFA', text: '#09090B', muted: '#52525B', border: '#E4E4E7', accent: '#18181B', accentText: '#FFFFFF', accentHover: '#27272A', headerBg: '#FFFFFF', announceBg: '#09090B', announceText: '#FAFAFA' },
        dark:  { bg: '#09090B', surface: '#18181B', text: '#FAFAFA', muted: '#A1A1AA', border: '#27272A', accent: '#FAFAFA', accentText: '#09090B', accentHover: '#E4E4E7', headerBg: '#18181B', announceBg: '#000000', announceText: '#FAFAFA' }
      },
      {
        id: 4,
        name: 'Slate & Deep Teal',
        desc: 'Modern creative. Cool slate base with refined teal accent.',
        light: { bg: '#F8FAFC', surface: '#FFFFFF', text: '#0F172A', muted: '#64748B', border: '#E2E8F0', accent: '#0F766E', accentText: '#FFFFFF', accentHover: '#0D5F59', headerBg: '#FFFFFF', announceBg: '#0F172A', announceText: '#E8ECF0' },
        dark:  { bg: '#0F1419', surface: '#1A2332', text: '#E8ECF0', muted: '#94A3B8', border: '#1E293B', accent: '#2DD4BF', accentText: '#0F1419', accentHover: '#5EEAD4', headerBg: '#1A2332', announceBg: '#000000', announceText: '#E8ECF0' }
      },
      {
        id: 5,
        name: 'Warm Ivory & Burnt Amber',
        desc: 'Print-on-paper feel. Cream ivory with rich burnt amber.',
        light: { bg: '#FFF8F0', surface: '#FFFFFF', text: '#1C1917', muted: '#78716C', border: '#EDE4D8', accent: '#B45309', accentText: '#FFFFFF', accentHover: '#92400E', headerBg: '#FFFFFF', announceBg: '#1C1917', announceText: '#F5EDE3' },
        dark:  { bg: '#0F0D0B', surface: '#1A1612', text: '#F5EDE3', muted: '#A8A29E', border: '#2A241E', accent: '#D97706', accentText: '#0F0D0B', accentHover: '#F59E0B', headerBg: '#1A1612', announceBg: '#000000', announceText: '#F5EDE3' }
      }
    ];

    const current = {
      light: { bg: '#FFFFFF', surface: '#FFFFFF', text: '#181818', muted: '#666666', border: '#E8E8E8', accent: '#FFBA00', accentText: '#000000', accentHover: '#E6A800', headerBg: '#FFFFFF', announceBg: '#000000', announceText: '#FFFFFF' },
      dark:  { bg: '#0C0C0C', surface: '#111111', text: '#F4F4F2', muted: '#A8A8A8', border: '#2A2A2A', accent: '#FFBA00', accentText: '#000000', accentHover: '#E6A800', headerBg: '#FFFFFF', announceBg: '#000000', announceText: '#FFFFFF' }
    };

    function renderPreview(t, mode) {
      const ghostBorder = t.text;
      const ghostColor = t.text;
      const headerText = mode === 'dark' ? t.text : t.text;
      const headerBg = mode === 'dark' ? t.headerBg : t.headerBg;
      const logoBadgeBg = mode === 'dark' ? t.text : '#000000';
      const logoBadgeColor = mode === 'dark' ? t.bg : '#FFFFFF';

      return `
        <div class="preview" style="background:${t.bg};color:${t.text}">
          <div class="preview-inner">
            <div class="mock-announce" style="background:${t.announceBg};color:${t.announceText}">Free shipping on orders over ₹999 · Use code WALL10</div>
            <div class="mock-header" style="background:${headerBg};color:${headerText};border-color:${t.border}">
              <div class="mock-logo" style="color:${headerText}">
                <span class="mock-logo-badge" style="background:${logoBadgeBg};color:${logoBadgeColor}">PL</span>
                POSTERLEAGUE
              </div>
              <div class="mock-nav" style="color:${headerText}">
                POSTERS <span class="mock-hot" style="background:${t.accent};color:${t.accentText}">HOT</span>
              </div>
            </div>
            <div class="mock-hero">
              <div class="mock-pill" style="border-color:${t.border};color:${t.muted}">New drops weekly</div>
              <div class="mock-title" style="color:${t.text}">Your Walls.<br>Your Style.</div>
              <div class="mock-sub" style="color:${t.muted}">Premium posters & split sets. Museum-grade print quality.</div>
              <div class="mock-btns">
                <span class="mock-btn" style="background:${t.accent};color:${t.accentText}">Shop Now →</span>
                <span class="mock-btn" style="border-color:${ghostBorder};color:${ghostColor};background:transparent">Explore All</span>
              </div>
              <div class="mock-features" style="border-color:${t.border}">
                <div class="mock-feat" style="border-color:${t.border}">
                  <strong style="color:${t.text}">300gsm</strong>
                  <span style="color:${t.muted}">Paper weight</span>
                </div>
                <div class="mock-feat" style="border-color:${t.border}">
                  <strong style="color:${t.text}">High Gloss</strong>
                  <span style="color:${t.muted}">Lamination</span>
                </div>
                <div class="mock-feat" style="border-color:${t.border}">
                  <strong style="color:${t.text}">Scratch Free</strong>
                  <span style="color:${t.muted}">Protection</span>
                </div>
              </div>
            </div>
          </div>
        </div>`;
    }

    function renderSwatches(opt) {
      const t = opt.dark;
      return ['bg','accent','text','muted','border'].map(k => {
        const hex = t[k];
        const label = k === 'bg' ? t.bg : k === 'accent' ? t.accent : k === 'text' ? t.text : k === 'muted' ? t.muted : t.border;
        return `<div class="swatch"><span style="background:${label}"></span><span>${label}</span></div>`;
      }).join('');
    }

    function renderOption(opt) {
      return `
        <article class="option-card">
          <div class="option-label">
            <h2>Option ${opt.id} — ${opt.name}</h2>
            <p>${opt.desc}</p>
          </div>
          <div class="swatches">${renderSwatches(opt)}</div>
          <div class="modes">
            <div class="mode-tag" style="background:#f5f5f5;color:#333">Light</div>
            <div class="mode-tag" style="background:#222;color:#aaa">Dark</div>
            ${renderPreview(opt.light, 'light')}
            ${renderPreview(opt.dark, 'dark')}
          </div>
        </article>`;
    }

    document.getElementById('options-grid').innerHTML = options.map(renderOption).join('');
    document.getElementById('current-previews').innerHTML = `
      <div><div class="mode-tag" style="background:#f5f5f5;color:#333">Light</div>${renderPreview(current.light, 'light')}</div>
      <div><div class="mode-tag" style="background:#222;color:#aaa">Dark</div>${renderPreview(current.dark, 'dark')}</div>
    `;
  </script>
</body>
</html>
